services:
  db:
    image: postgres:15-alpine
    container_name: geo_postgres_db
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_DB: geodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: geo_measurement_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://geouser:geopassword@db:5432/geodb
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data: